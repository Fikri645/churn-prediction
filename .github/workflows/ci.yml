name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn xgboost lightgbm imbalanced-learn shap matplotlib pydantic pytest pytest-cov ruff

      - name: Lint with ruff
        run: ruff check src/ tests/ api/ app/ --ignore E501
        continue-on-error: true   # lint warnings don't block CI

      - name: Run unit tests
        run: pytest tests/ -v --tb=short
